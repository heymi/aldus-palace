name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · eval · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # No secrets are required: the deterministic `dev` provider runs offline.
      - name: Deterministic suites
        run: pnpm test

      - name: Acceptance fixtures
        run: pnpm eval

      - name: Build @aldus-palace/core
        run: pnpm build

      - name: spec/schema.sql is up to date
        run: pnpm spec:check
