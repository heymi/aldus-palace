<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aldus — reference client</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip" href="#capture" data-i18n="skip"></a>

    <header class="masthead">
      <div class="masthead-row">
        <h1>Aldus</h1>
        <div class="masthead-tools">
          <p class="status" id="status"></p>
          <div class="lang" id="lang-switch" role="group" aria-label="Language"></div>
        </div>
      </div>
      <p class="deck" data-i18n="masthead.deck"></p>
    </header>

    <nav class="tabs" aria-label="Sections">
      <a href="#capture" data-i18n="nav.capture"></a>
      <a href="#today"><span data-i18n="nav.today"></span> <span class="tally" id="today-tally"></span></a>
      <a href="#memory"><span data-i18n="nav.memory"></span> <span class="tally" id="memory-tally"></span></a>
      <a href="#decisions">
        <span data-i18n="nav.decisions"></span>
        <span class="tally tally-accent" id="decision-tally" hidden></span>
      </a>
    </nav>

    <main>
      <section id="capture" class="capture" aria-labelledby="capture-title">
        <h2 id="capture-title" class="hero" data-i18n="capture.hero"></h2>
        <p class="capture-sub" data-i18n="capture.sub"></p>
        <form id="capture-form">
          <textarea
            id="input"
            rows="2"
            data-i18n-placeholder="capture.placeholder"
            aria-label="A sentence to capture"
          ></textarea>
          <div class="row">
            <button type="submit" class="primary" id="file-button" data-i18n="capture.button"></button>
            <span class="hint" id="capture-hint"></span>
          </div>
        </form>
        <div class="chips" id="examples">
          <span class="chips-label" id="chips-label"></span>
        </div>
        <div id="receipt" class="receipt" hidden aria-live="polite"></div>
      </section>

      <div class="work">
        <section id="today" class="panel" aria-labelledby="today-title">
          <header class="panel-head">
            <h2 id="today-title" data-i18n="today.title"></h2>
            <span class="panel-note" id="today-note"></span>
          </header>
          <div id="now"></div>
        </section>

        <section id="memory" class="panel" aria-labelledby="memory-title">
          <header class="panel-head">
            <h2 id="memory-title" data-i18n="memory.title"></h2>
            <label class="toggle">
              <input type="checkbox" id="show-candidates" />
              <span data-i18n="memory.candidates"></span>
            </label>
          </header>
          <div id="memory-list"></div>
        </section>
      </div>

      <section id="decisions" class="panel" aria-labelledby="decisions-title">
        <header class="panel-head">
          <h2 id="decisions-title" data-i18n="decisions.title"></h2>
          <span class="panel-note" id="decisions-note"></span>
        </header>
        <div id="actions"></div>
      </section>
    </main>

    <footer>
      <p id="footer-text"></p>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
