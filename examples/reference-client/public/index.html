<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aldus — reference client</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip" href="#content" data-i18n="skip"></a>

    <div class="desktop">
      <div class="window">
        <header class="titlebar">
          <div class="traffic" aria-hidden="true">
            <span class="dot dot-close"></span>
            <span class="dot dot-min"></span>
            <span class="dot dot-zoom"></span>
          </div>
          <div class="titlebar-title">
            <strong data-i18n="app.name"></strong>
            <span data-i18n="app.tagline"></span>
          </div>
          <div class="titlebar-tools">
            <span class="status" id="status"></span>
            <div class="lang" id="lang-switch" role="group"></div>
            <button type="button" class="tool" id="quick-capture">
              <span data-i18n="toolbar.capture"></span>
              <kbd data-i18n="toolbar.captureHint"></kbd>
            </button>
          </div>
        </header>

        <div class="split" id="split">
          <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>

          <main class="content" id="content">
            <header class="content-head">
              <div>
                <h1 id="section-title"></h1>
                <p id="section-subtitle"></p>
              </div>
              <div class="content-actions" id="section-actions"></div>
            </header>
            <div class="panes" id="panes"></div>
          </main>

          <aside class="inspector" id="inspector" hidden></aside>
        </div>

        <footer class="statusbar">
          <span id="statusbar"></span>
          <span class="statusbar-note" id="footer-text"></span>
        </footer>
      </div>
    </div>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <header class="sheet-head">
          <h2 id="sheet-title" data-i18n="sheet.title"></h2>
          <span class="hint" id="sheet-hint" data-i18n="sheet.hint"></span>
        </header>
        <form id="sheet-form">
          <textarea id="sheet-input" rows="2" data-i18n-placeholder="input.placeholder"></textarea>
          <div class="sheet-actions">
            <button type="submit" class="primary" id="sheet-button" data-i18n="input.button"></button>
            <button type="button" class="ghost" id="sheet-close" data-i18n="sheet.close"></button>
          </div>
        </form>
        <div id="sheet-receipt" class="receipt" hidden aria-live="polite"></div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
