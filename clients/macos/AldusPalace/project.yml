name: AldusPalace
options:
  bundleIdPrefix: app.alduspalace
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  AldusPalace:
    type: application
    platform: macOS
    sources:
      - AldusPalace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alduspalace.AldusPalace
        INFOPLIST_KEY_CFBundleDisplayName: Aldus Palace
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_NAME: AldusPalace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
