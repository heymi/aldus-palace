<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" role="img" aria-label="A capture session: four sentences in, records out">
  <rect width="880" height="452" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="880" height="38" rx="12" fill="#161b22"/>
  <rect x="0" y="26" width="880" height="12" fill="#161b22"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="19" r="6" fill="#febc2e"/>
  <circle cx="64" cy="19" r="6" fill="#28c840"/>
  <text x="440" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8b949e" text-anchor="middle">pnpm --filter @aldus-palace/example-understanding-only start</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
    <text x="28" y="74" fill="#e6edf3">&#9656; Ship the onboarding page next week</text>
    <text x="28" y="98" fill="#7ee787">  commitment</text>
    <text x="186" y="98" fill="#8b949e">&#8212; the date resolved on the server, no due-date field</text>

    <text x="28" y="136" fill="#e6edf3">&#9656; AI products feel noisy lately, too many interruptions</text>
    <text x="28" y="160" fill="#79c0ff">  thought</text>
    <text x="186" y="160" fill="#8b949e">&#8212; a remark about a mood stays a remark</text>

    <text x="28" y="198" fill="#e6edf3">&#9656; I prefer simple tools</text>
    <text x="28" y="222" fill="#d2a8ff">  remembered</text>
    <text x="186" y="222" fill="#8b949e">&#8212; stated by you, archivable from the memory list</text>

    <text x="28" y="262" fill="#484f58">&#9656; (the first sentence, said a second time)</text>
    <text x="28" y="286" fill="#ffa657">  &#8627; points at the record from line one, stored once</text>

    <text x="28" y="326" fill="#6e7681">&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;</text>
    <text x="28" y="354" fill="#e6edf3">receipt &#183; Captured &#183; 1 commitment</text>
    <text x="28" y="382" fill="#8b949e">no API key &#183; no network &#183; deterministic rules in English and Chinese</text>
    <text x="28" y="410" fill="#8b949e">24 test suites &#183; 11 acceptance fixtures &#183; replayed offline</text>
  </g>
</svg>
